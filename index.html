<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planner</title>
    <meta name="description" content="A calm daily planner: one thing a day, a small routine, and plenty of open time." />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131413" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="app" class="app"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#today" data-route="today">Today</a>
      <a href="#plan" data-route="plan">Plan</a>
      <a href="#checkin" data-route="checkin">Check-in</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
    <noscript>This planner needs JavaScript turned on.</noscript>
  </body>
</html>
